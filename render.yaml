# Render Blueprint for the FastAPI backend.
# In Render: New > Blueprint > connect this repo. It reads this file.
# You must set ANTHROPIC_API_KEY in the dashboard (it is intentionally not stored here).
services:
  - type: web
    name: prereqpilot-api
    runtime: python
    plan: free            # free tier sleeps after ~15 min idle; bump to "starter" to stay warm
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false       # secret — set this in the Render dashboard, not in git
      - key: ALLOWED_ORIGINS
        value: https://prereqpilot.dev,https://www.prereqpilot.dev
